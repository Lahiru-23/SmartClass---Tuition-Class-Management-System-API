spring.application.name=SmartClass 

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/smartclass_db1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=smartclass-super-secret-key-change-in-production-min-256-bits-long
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=604800000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- AI Chat Assistant ----
# provider=local uses the built-in, always-available rule-based assistant (no key needed).
# Set provider=openai and supply an api-key to route general questions to an external LLM
# (any question the local assistant can answer directly is still answered locally first).
ai.provider=local
ai.api-key=
ai.api-url=https://api.openai.com/v1/chat/completions
ai.model=gpt-4o-mini

logging.level.root=INFO
logging.level.lk.smartclass=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
logging.file.name=logs/smartclass.log